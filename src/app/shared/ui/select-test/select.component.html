<div class="select-container">
  @if (label()) {
    <label [class]="classesLabel">
      {{ label() }}
    </label>
  }
  <select [class]="classesSelect" (change)="onChange($event)">
    @for (option of options(); track $index) {
      <option [value]="option" [selected]="option === value()">
        {{ option }}
      </option>
    }
  </select>
</div>
