<button type="button" [disabled]="false" [class]="classes" (click)="onClick()">
  @if (selected) {
    <span class="mr-2"><i class="fa-solid fa-check"></i></span>
  }

  <ng-content />

  @if (badgeCount > 0) {
    <span
      class="absolute -top-2 -right-2 bg-neutral-400 dark:bg-neutral-600 text-white text-xs rounded-full w-5 h-5 flex items-center justify-center"
    >
      {{ badgeCount }}
    </span>
  }
</button>
