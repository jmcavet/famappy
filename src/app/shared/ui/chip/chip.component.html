<button type="button" [disabled]="false" [class]="classes" (click)="onClick()">
  @if (selected) {
    <span class="mr-2"><i class="fa-solid fa-check"></i></span>
  }

  <ng-content />

  @if (badgeCount > 0) {
    <span
      [class]="badgeClasses"
      [attr.aria-label]="badgeCount + ' selected ingredients'"
    >
      {{ badgeCount }}
    </span>
  }
</button>
