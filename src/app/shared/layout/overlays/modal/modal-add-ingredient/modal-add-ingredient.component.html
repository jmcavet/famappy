<app-section [surface]="3">
  <app-stack variant="page">
    <h2 class="text-title text-center">{{ title }}</h2>

    <app-stack variant="section">
      <app-stack variant="compact">
        <input
          type="text"
          id="name"
          name="name"
          required
          placeholder="Name"
          class="inset-x-md surface-1"
          autocomplete="off"
          [(ngModel)]="name"
          (ngModelChange)="onInputChange($event)"
          (keydown.enter)="onConfirm()"
        />
        @if (invalidMessage) {
          <span class="invalid">{{ invalidMessage }}</span>
        }
      </app-stack>

      <app-stack variant="compact">
        <p class="color-text-muted">Select a unit</p>
        <app-inline>
          <app-chip [selected]="unit() === null" (toggle)="selectUnit(null)"
            ><i class="fa-solid fa-ban"></i
          ></app-chip>
          <app-chip [selected]="unit() === 'cl'" (toggle)="selectUnit('cl')"
            >cl</app-chip
          >
          <app-chip [selected]="unit() === 'l'" (toggle)="selectUnit('l')"
            >l</app-chip
          >
          <app-chip [selected]="unit() === 'g'" (toggle)="selectUnit('g')"
            >g</app-chip
          >
          <app-chip [selected]="unit() === 'Kg'" (toggle)="selectUnit('Kg')"
            >Kg</app-chip
          >
        </app-inline>
      </app-stack>

      <app-stack variant="compact">
        <p class="color-text-muted">Enter a default shopping measure</p>
        <input
          type="number"
          id="measure"
          name="measure"
          min="0"
          step="any"
          placeholder="e.g. 1 liter for a pack of milk"
          class="inset-x-md surface-1"
          autocomplete="off"
          [(ngModel)]="measure"
          (keydown.enter)="onConfirm()"
          [disabled]="unit() === null"
          [class.disabled]="unit() === null"
        />
      </app-stack>
    </app-stack>

    <app-row>
      <app-button
        variant="outline"
        color="neutral"
        size="md"
        (clicked)="onCancel()"
        >Cancel</app-button
      >

      <app-button
        [color]="btnConfirmColor"
        size="md"
        (clicked)="onConfirm()"
        [disabled]="
          invalidMessage !== undefined ||
          name().length === 0 ||
          measure() === null
        "
        >{{ btnConfirmText }}</app-button
      >
    </app-row>
  </app-stack>
</app-section>
