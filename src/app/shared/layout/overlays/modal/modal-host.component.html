@if (modalService.config(); as config) {
  <div
    [class]="
      config.fullScreen
        ? 'fixed inset-0 z-50 flex items-start justify-center lg:items-center'
        : 'fixed inset-0 z-50 flex items-start justify-center sm:items-center'
    "
    (click)="modalService.cancel()"
  >
    <!-- Backdrop -->
    <div class="absolute inset-0 bg-neutral-950/60 backdrop-blur-sm"></div>

    <div
      [class]="
        config.fullScreen
          ? 'relative z-10 flex w-full justify-center overflow-y-auto'
          : 'relative z-10 max-h-[90dvh] w-full overflow-y-auto modal sm:max-w-lg'
      "
      (click)="$event.stopPropagation()"
    >
      <ng-container
        *ngComponentOutlet="config.component; inputs: config.data"
      />
    </div>
  </div>
}
