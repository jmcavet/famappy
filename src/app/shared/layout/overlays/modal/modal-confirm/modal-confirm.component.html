<div class="modal-container surface-3">
  <h2 class="header">{{ title }}</h2>

  <div class="message-container">{{ message }}</div>

  <div class="flex-between">
    <app-button
      variant="ghost"
      [color]="btnConfirmColor"
      size="lg"
      (clicked)="onCancel()"
      >Cancel</app-button
    >

    <app-button [color]="btnConfirmColor" (clicked)="onConfirm()">{{
      btnConfirmText
    }}</app-button>
  </div>
</div>
