@if (dataIsLoading()) {
  <app-stack align="center">
    <app-loading />
  </app-stack>
} @else {
  <div class="absolute -left-8 top-6">
    <app-section>
      <app-stack>
        @for (parent of parents(); track parent.id; let i = $index) {
          <app-button variant="ghost" size="lg" (clicked)="assignCook(parent)">
            {{ parent.name }}
          </app-button>
        }
      </app-stack>
    </app-section>
  </div>
}
