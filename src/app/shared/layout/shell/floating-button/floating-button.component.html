<div class="fixed bottom-12 left-1/2 -translate-x-1/2 z-50">
  <app-button
    [color]="color()"
    shape="pill"
    [routerLink]="routerLink()"
    [shadow]="true"
    (clicked)="clicked.emit($event)"
    [disabled]="disabled()"
  >
    <div class="h-6 w-6">
      <i class="fa-solid fa-xl" [ngClass]="icon()"></i>
    </div>
  </app-button>
</div>
