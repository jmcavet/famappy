<div class="h-full layout-hcf">
  <app-header-shell
    ><div class="inset-md">
      <app-stepper [navStep]="2" /></div
  ></app-header-shell>

  <app-page-layout>
    @if (dataIsLoading()) {
      <app-stack align="center">
        <app-loading />
      </app-stack>
    } @else {
      <app-section inset="lg">
        <app-stack variant="section">
          <h2 class="font-roboto text-title">
            How many meals do you want to plan?
          </h2>

          <app-select
            [options]="nbMeals"
            [control]="mealNbSelected"
            [responsive]="true"
          ></app-select>
        </app-stack>
      </app-section>

      <app-section inset="lg">
        <app-stack variant="section">
          <h2 class="font-roboto text-title">
            Which categories are you interested in?
          </h2>

          <label class="flex cursor-pointer items-center gap-2 py-2">
            <input
              id="select-all-categories"
              type="checkbox"
              class="h-5 w-5"
              [checked]="allCategoriesSelected()"
              [indeterminate]="someCategoriesSelected()"
              (change)="toggleAllCategories()"
            />
            <span>Select all categories</span>
          </label>

          <app-inline [wrap]="true">
            @for (cat of filteredCategories(); track cat.id) {
              <app-chip
                [fullWidth]="true"
                [selected]="selectedCategoriesIds().includes(cat.id)"
                (toggle)="toggleSelection(cat)"
                >{{ cat.name }}</app-chip
              >
            }
          </app-inline>
        </app-stack>
      </app-section>
    }
  </app-page-layout>

  <app-section [surface]="0">
    <app-button
      [fullWidth]="true"
      [disabled]="proceedButtonIsDisabled()"
      (clicked)="proceed()"
      routerLink="/meals/filter"
    >
      Proceed
    </app-button>
  </app-section>
</div>
