@if (membersAreLoaded()) {
  <app-row>
    <app-inline>
      <span class="meal-type" [class.dinner]="mealType === 'dinner'">
        {{ mealType | capitalize }}
      </span>
      @if (showMealAddingOptions) {
        <span
          ><app-meal-adding-options
            [dailyMealPlan]="dailyMealPlan()!"
            [mealType]="mealType"
        /></span>
      }

      @if (showAssignButton) {
        <app-button
          variant="ghost"
          color="classic"
          (clicked)="assignMeal()"
          [disabled]="!canAssignRecipes()"
        >
          <i class="fa-regular fa-plus fa-2xl"></i>
        </app-button>
      }
    </app-inline>

    @if (showServingIncrements) {
      <div class="w-1/2">
        <app-servings-control
          [servings]="uiServings()"
          (servingsChange)="onServingsChange($event)"
        />
      </div>
    } @else {
      @if (dailyMealPerMealType().length) {
        <app-inline>
          <i class="fa-solid fa-user"></i>
          <app-modal-servings-selection
            [dailyMealPerMealType]="dailyMealPerMealType()"
            [servings]="servings()"
            [mealType]="mealType"
          />
        </app-inline>
      }
    }

    <app-meal-cook-selection
      [dailyMealPerMealType]="dailyMealPerMealType()"
      [selectedDay]="selectedDay()"
      mealType="{{ mealType }}"
      [cookName]="uiCookName()"
    />
  </app-row>
}
