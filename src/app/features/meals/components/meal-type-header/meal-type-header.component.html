@if (membersAreLoaded()) {
  <app-row>
    <app-inline>
      <span class="meal-type" [class.dinner]="mealType === 'dinner'">
        {{ mealType | capitalize }}
      </span>
      <span
        ><app-meal-adding-options
          [dailyMealPlan]="dailyMealPlan()!"
          [mealType]="mealType"
      /></span>
      @if (showAssignButton) {
        <button (click)="assignMeal()">
          <i
            class="fa-solid fa-plus fa-2xl text-neutral-300 dark:text-neutral-600 cursor-not-allowed"
            [class.active]="selectedRecipes.length > 0"
          ></i>
        </button>
      }
    </app-inline>

    @if (showServingIncrements) {
      <app-inline>
        <i class="fa-solid fa-user"></i>

        <app-inline>
          <app-button variant="ghost" size="md" (clicked)="decreaseServings()"
            ><i class="fa-solid fa-minus"></i
          ></app-button>
          <span>{{ uiServings() }}</span>
          <app-button variant="ghost" size="md" (clicked)="increaseServings()"
            ><i class="fa-solid fa-plus"></i
          ></app-button>
        </app-inline>
      </app-inline>
    } @else {
      @if (dailyMealPerMealType().length) {
        <app-inline>
          <i class="fa-solid fa-user"></i>
          <app-modal-servings-selection
            [dailyMealPerMealType]="dailyMealPerMealType()"
            [servings]="servings()"
            [mealType]="mealType"
          />
        </app-inline>
      }
    }

    <app-meal-cook-selection
      [dailyMealPerMealType]="dailyMealPerMealType()"
      [selectedDay]="selectedDay()"
      mealType="{{ mealType }}"
      [cookName]="uiCookName()"
    />
  </app-row>
}
