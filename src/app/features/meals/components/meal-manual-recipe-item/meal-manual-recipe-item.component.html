<button (click)="viewMeal()" class="w-full">
  <app-row>
    <app-inline>
      <i class="fa-solid fa-bolt-lightning"></i>
      <span>{{ mealName() }}</span>
    </app-inline>

    <app-button variant="ghost" (clicked)="openDeleteModal()">
      <i
        class="fa-solid fa-trash-arrow-up fa-md text-red-500 dark:text-red-700"
      ></i>
    </app-button>
  </app-row>
</button>
