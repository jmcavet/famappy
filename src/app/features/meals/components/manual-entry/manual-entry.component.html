<div class="surface-3 max-h-[90dvh]">
  <app-section>
    <app-stack variant="section">
      <header class="w-full">
        <app-row justify="center">
          <h1 class="text-headline">{{ title() }}</h1>
        </app-row>
      </header>

      <section class="w-full">
        <app-stack variant="compact">
          <h2 class="field-label">Meal name</h2>
          <input
            #autoFocusInput
            type="text"
            id="mealDescription"
            name="mealDescription"
            required
            placeholder="Provide a meal description"
            autocomplete="off"
            [value]="mealDescription()"
            (input)="mealDescription.set($any($event.target).value)"
            class="inset-x-md surface-1"
          />
        </app-stack>
      </section>

      <section class="w-full">
        <app-stack variant="compact">
          <h2 class="field-label">Ingredients</h2>
          <app-inline>
            <input
              type="text"
              id="ingredient"
              name="ingredient"
              required
              placeholder="Search/enter an ingredient"
              autocomplete="off"
              [value]="ingredientSearched()"
              (input)="ingredientSearched.set($any($event.target).value)"
              (keydown.enter)="ingredientSearched() ? addIngredient() : null"
              class="inset-x-md surface-1 w-full"
            />
            <app-button
              (clicked)="addIngredient()"
              [disabled]="ingredientSearched().length === 0"
              ><app-inline gap="sm"
                ><i class="fa-regular fa-plus fa-xl"></i
                ><span>Add</span></app-inline
              ></app-button
            >
          </app-inline>

          <app-stack>
            @for (suggestedIngredient of suggestedIngredients(); track $index) {
              <div class="inset-x-md">
                <app-button
                  variant="ghost"
                  color="neutral"
                  (clicked)="selectSuggestedIngredient(suggestedIngredient)"
                  >{{ suggestedIngredient }}</app-button
                >
              </div>
            }
          </app-stack>
        </app-stack>
      </section>
      <section class="w-full flex-1 overflow-y-auto">
        <app-stack>
          @for (ingredient of ingredients(); track $index) {
            <div class="w-full surface-2 inset-inline-sm">
              <app-inline>
                <span class="flex-1">{{ ingredient.name }}</span>
                @if (ingredient.fromDb) {
                  <i class="fa-solid fa-utensils"></i>
                }
                <app-button
                  variant="ghost"
                  size="sm"
                  color="danger"
                  (clicked)="removeIngredient($index)"
                  ><i class="fa-regular fa-trash-can text-xl"></i
                ></app-button>
              </app-inline>
            </div>
          }
        </app-stack>
      </section>

      <footer class="w-full">
        <app-inline>
          <div (click)="toggleCreateAnother()">
            <app-inline gap="sm">
              <input
                type="checkbox"
                [checked]="createAnother()"
                class="h-5 w-5 rounded border-neutral-300 text-primary focus:ring-primary dark:text-primary-dark dark:focus:ring-primary-dark"
              />
              <label class="w-full color-text-slightly-muted whitespace-nowrap">
                Create another
              </label>
            </app-inline>
          </div>
          <app-inline class="w-full">
            <app-button variant="outline" (clicked)="cancel()"
              >Cancel</app-button
            >
            <app-button
              [fullWidth]="true"
              (clicked)="onConfirm()"
              [disabled]="mealDescription().length === 0"
              >Create</app-button
            >
          </app-inline>
        </app-inline>
      </footer>
    </app-stack>
  </app-section>
</div>
