@if (pageIsLoading()) {
  <app-stack align="center">
    <app-loading />
  </app-stack>
} @else {
  <div class="layout-stack h-dvh">
    <app-header-shell
      ><div class="inset-md">
        <app-stack variant="page">
          <app-row>
            <div class="relative w-full">
              <div class="absolute">
                <app-button variant="ghost" size="sm" (clicked)="goBack()"
                  ><i class="fa-solid fa-arrow-left-long text-xl"></i
                ></app-button>
              </div>
              <h1 class="text-headline font-roboto text-center">
                Manage Ingredients
              </h1>
            </div>
          </app-row>

          <app-ingredient-categories-selection-page />

          <app-ingredient-adder
            [existingIngredientNames]="existingIngredientNames()"
          />

          <app-ingredient-filter
            [(filterSelected)]="filterSelected"
            [isAscending]="isAscending()"
            (filterSelectedChange)="onFilterSelected($event)"
          />
        </app-stack>
      </div>
    </app-header-shell>

    <app-page-layout>
      <app-section>
        <app-stack>
          <div
            class="grid grid-cols-[minmax(0,0.75fr)_minmax(0,2fr)_auto] items-center gap-x-sm gap-y-lg"
          >
            @for (
              ingredient of ingredientsFiltered();
              track $index;
              let i = $index
            ) {
              <span class="min-w-0 break-words italic text-sm color-text-muted">
                {{ ingredient.categoryName }}
              </span>
              <app-inline [wrap]="true" gap="xs" class="min-w-0">
                <span class="min-w-0 break-words">{{ ingredient.name }}</span>
                <app-inline gap="xs" class="shrink-0 color-text-subtle">
                  <span>{{ ingredient.measure }}</span>
                  <span>{{ ingredient.unit }}</span>
                </app-inline>
              </app-inline>
              <div class="justify-self-end">
                <app-inline gap="xs">
                  <app-button
                    variant="ghost"
                    size="sm"
                    (clicked)="openUpdateModal(ingredient)"
                    ><i class="fa-regular fa-pen-to-square text-xl"></i
                  ></app-button>
                  <app-button
                    variant="ghost"
                    size="sm"
                    color="danger"
                    (clicked)="openDeleteModal($event, ingredient.id)"
                    ><i class="fa-regular fa-trash-can text-xl"></i
                  ></app-button>
                </app-inline>
              </div>
            }
          </div>
        </app-stack>
      </app-section>
    </app-page-layout>
  </div>
}
