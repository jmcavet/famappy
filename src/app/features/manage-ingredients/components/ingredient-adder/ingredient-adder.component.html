<app-section [surface]="0">
  <app-stack>
    <app-button
      size="sm"
      (clicked)="openAddModal($event)"
      [fullWidth]="true"
      [disabled]="buttonIsDisabled()"
    >
      <app-inline>
        <i class="fa-solid fa-plus text-xl"></i>
        <span>Add a new ingredient</span>
      </app-inline>
    </app-button>
  </app-stack>
</app-section>

@if (ingredientBeingSaved()) {
  <app-stack align="center">
    <app-loading />
  </app-stack>
}
