<div class="items-container">
  <ul>
    @for (mealCategory of dbMealCategories(); track $index) {
      <li>
        <span>{{ mealCategory.name | capitalize }}</span>
        <div class="buttons-container">
          <button type="button">
            <button
              type="button"
              (click)="openUpdateMealCategoryInputModal($event, mealCategory)"
            >
              <i
                class="fa-regular fa-pen-to-square text-primary-600 dark:text-primary-500 text-xl"
              ></i>
            </button>
          </button>
          <button
            type="button"
            (click)="openDeleteModal($event, mealCategory.id)"
          >
            <i
              class="fa-regular fa-trash-can text-danger-600 dark:text-danger-500 text-xl"
            ></i>
          </button>
        </div>
      </li>
    }
  </ul>
</div>

<app-floating-button
  (clicked)="openAddMealCategoryInputModal($event)"
></app-floating-button>

<div class="flex flex-col items-center">
  @if (canShowPage()) {
    <app-loading />
  }
</div>
