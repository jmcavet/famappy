@if (pageIsLoading()) {
  <app-stack align="center">
    <app-loading />
  </app-stack>
} @else {
  <div class="layout-stack h-dvh">
    <app-header-shell
      ><div class="inset-md">
        <app-stack>
          <app-row>
            <div class="relative w-full">
              <div class="absolute">
                <app-button variant="ghost" size="sm" (clicked)="goBack()"
                  ><i class="fa-solid fa-arrow-left-long text-xl"></i
                ></app-button>
              </div>
              <h1 class="text-headline font-roboto text-center">
                Manage ingredient categories
              </h1>
            </div>
          </app-row>
        </app-stack>
      </div>
    </app-header-shell>

    <app-page-layout>
      <app-section>
        <app-stack variant="section">
          <div
            class="grid grid-cols-[minmax(0,1fr)_auto] items-center gap-x-sm gap-y-lg"
          >
            @for (
              ingredientCategory of dbIngredientCategories();
              track $index
            ) {
              <div
                class="col-span-full grid [grid-template-columns:subgrid] items-center rounded inset-inline-sm surface-2"
              >
                <span class="min-w-0 break-words">{{
                  ingredientCategory.name
                }}</span>
                <div class="justify-self-end">
                  <app-inline gap="xs">
                    <app-button
                      variant="ghost"
                      size="sm"
                      (clicked)="openUpdateModal($event, ingredientCategory)"
                      ><i class="fa-regular fa-pen-to-square text-xl"></i
                    ></app-button>

                    <app-button
                      variant="ghost"
                      size="sm"
                      color="danger"
                      (clicked)="openDeleteModal($event, ingredientCategory.id)"
                      ><i class="fa-regular fa-trash-can text-xl"></i
                    ></app-button>
                  </app-inline>
                </div>
              </div>
            }
          </div>
        </app-stack>
      </app-section>
    </app-page-layout>
  </div>
}
