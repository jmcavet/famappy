@if (canShowPage()) {
  <app-stack align="center">
    <app-loading />
  </app-stack>
} @else {
  <div class="layout-stack h-dvh">
    <app-header-shell
      ><app-recipe-search
        [(filter)]="filterText"
        [recipesFilteredByTitle]="recipesFilteredByTitle()"
        [recipesFiltered]="recipesFiltered()"
        [dbMealCategories]="dbMealCategories()"
        [dbCuisines]="dbCuisines()"
        [dbRecipeCategories]="dbRecipeCategories()"
        [dbIngredients]="dbIngredients()"
        [dbIngredientCategories]="dbIngredientCategories()"
    /></app-header-shell>
    <app-page-layout maxSize="lg">
      <app-grid-responsive [colsMd]="3" [colsLg]="4" gap="sm">
        @for (recipe of recipesFiltered(); track $index) {
          <app-recipe-card
            [recipeState]="recipe"
            (click)="clickOnRecipeCard(recipe)"
          ></app-recipe-card>
        }
      </app-grid-responsive>
    </app-page-layout>
    <app-footer />
  </div>

  <app-floating-button routerLink="/new-recipe"></app-floating-button>
}
