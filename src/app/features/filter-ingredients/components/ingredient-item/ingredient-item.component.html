<button
  (click)="selectItem()"
  [ngClass]="[
    'item-container inset-inline-md surface-2 surface-interactive',
    isSelected() ? 'selected' : '',
  ]"
>
  <app-row>
    <span class="text-neutral-400 dark:text-neutral-400 italic">
      {{ ingredient().categoryName }}
    </span>
    <span>{{ ingredient().name }}</span>
  </app-row>
</button>
