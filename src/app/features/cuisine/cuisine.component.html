<ul>
  @for (cuisine of dbCuisines(); track $index) {
    <li (click)="selectCuisine(cuisine.id)">
      {{ cuisine.name | capitalize }}
      @if (cuisineId() === cuisine.name) {
        <i
          class="fa-solid fa-check fa-xl text-primary-600 dark:text-primary-500"
        ></i>
      }
    </li>
  }
</ul>

<app-floating-button
  (clicked)="openAddCuisineInputModal($event)"
></app-floating-button>
