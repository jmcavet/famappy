<div class="h-full layout-hcf">
  <app-header-shell
    ><div class="inset-md">
      <app-stepper [navStep]="1" /></div
  ></app-header-shell>

  <app-page-layout>
    @if (dataIsLoading()) {
      <app-stack align="center">
        <app-loading />
      </app-stack>
    } @else {
      <app-section inset="lg">
        <app-stack variant="section">
          <h2 class="font-roboto text-title">Choose meals to export</h2>

          <app-button variant="ghost" (clicked)="selectAll()"
            >Select all</app-button
          >

          <app-grid col1="max" col2="1" col3="1" gapX="xl" gapY="lg">
            @for (day of weekDays; track $index; let i = $index) {
              <span
                [ngClass]="[
                  mealPlannedForDay(day.dayName, 'lunch') ||
                  mealPlannedForDay(day.dayName, 'dinner')
                    ? ''
                    : 'color-text-subtle',
                ]"
                >{{ day.dayName | capitalize }}</span
              >
              <app-chip
                [fullWidth]="true"
                [selected]="isSelected(day.dayName, 'lunch')"
                [disabled]="!mealPlannedForDay(day.dayName, 'lunch')"
                (toggle)="toggleSelection(day.dayName, 'lunch')"
                >Lunch</app-chip
              >
              <app-chip
                [fullWidth]="true"
                [selected]="isSelected(day.dayName, 'dinner')"
                [disabled]="!mealPlannedForDay(day.dayName, 'dinner')"
                (toggle)="toggleSelection(day.dayName, 'dinner')"
                >Dinner</app-chip
              >
            }
          </app-grid>
        </app-stack>
      </app-section>
    }
  </app-page-layout>

  <app-section [surface]="0">
    <div class="w-full">
      <app-inline>
        <app-button variant="outline" [fullWidth]="true" routerLink="/meals">
          Cancel
        </app-button>
        <app-button
          [fullWidth]="true"
          routerLink="/shopping/ingredients-selection"
          [disabled]="selectedMeals().length === 0"
          (clicked)="validateMeals()"
        >
          {{ vaidateButtonText() }}
        </app-button>
      </app-inline>
    </div>
  </app-section>
</div>
