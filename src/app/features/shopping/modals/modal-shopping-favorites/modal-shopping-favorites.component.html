<div
  class="favorites-modal surface-1 flex flex-col overflow-hidden rounded-b-xl"
>
  <header class="surface-2 relative flex items-center justify-center inset-md">
    <h1 class="text-title text-center">Favorites</h1>
    <button
      type="button"
      aria-label="Close Favorites"
      class="surface-interactive absolute right-4 flex h-10 w-10 items-center justify-center rounded-full"
      (click)="close()"
    >
      <i class="fa-solid fa-xmark" aria-hidden="true"></i>
    </button>
  </header>

  <main class="flex-1 overflow-y-auto">
    <div class="sticky top-0 z-10 surface-1">
      <app-stack>
        <div
          class="category-list-scroll inset-x-md inset-y-md min-w-0 overflow-x-hidden overflow-y-auto"
        >
          <app-inline class="w-full" gap="sm" [wrap]="true">
            @for (
              ingredientCategory of ingredientCategories();
              track ingredientCategory.id
            ) {
              <app-chip
                size="sm"
                [selected]="categoryIdSelected() === ingredientCategory.id"
                (toggle)="toggleSelection(ingredientCategory)"
                >{{ ingredientCategory.name }}</app-chip
              >
            }
          </app-inline>
        </div>
      </app-stack>
    </div>
    <app-stack>
      @for (
        ingredient of ingredientsPerCategorySelected();
        track ingredient.id
      ) {
        <p class="text-2xl py-12 px-4">{{ ingredient.name }}</p>
      }
    </app-stack>
  </main>

  <footer class="surface-2 inset-md">
    <app-row gap="md">
      <app-button
        variant="outline"
        color="neutral"
        [fullWidth]="true"
        (clicked)="close()"
        >Cancel</app-button
      >
      <app-button [fullWidth]="true" (clicked)="validate()"
        >Validate</app-button
      >
    </app-row>
  </footer>
</div>
